<!-- forgot-password.html — vista para iniciar recuperación de contraseña. -->

<!doctype html>
<html lang="es">
  <head>
    <script src="js/auth-guard.js"></script>
    <script src="js/api.js"></script>
    <script src="js/forgot-password.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar Contraseña - Divine Park</title>
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  </head>
  <body>
    <!-- Contenedor principal: layout de la página de autenticación -->
    <main class="auth-container">
      <!-- Sección informativa: logo y texto guía -->
      <section class="auth-info">
        <div class="auth-info__header">
          <!-- Logo del sistema: `alt` para accesibilidad -->
          <img src="assets/logo.jpg" class="logo" alt="Logo" />
          <h1>Divine Park</h1>
        </div>
        <div class="auth-info__content">
          <!-- Texto descriptivo que orienta al usuario sobre el proceso -->
          <h2>Panel de Operador</h2>
          <p>
            Recupera el acceso a tu sistema de gestión. Te enviaremos un código
            de verificación para restaurar tu contraseña de forma segura.
          </p>
        </div>
      </section>

      <!-- Sección del formulario: tarjeta visual que contiene el formulario -->
      <section class="auth-form-section">
        <div class="form-card">
          <header class="form-card__header">
            <!-- Icono visual para indicar seguridad (candado) -->
            <div class="lock-icon">
              <i class="fas fa-lock"></i>
            </div>
            <h3>¿Olvidaste tu Contraseña?</h3>
            <p>Ingresa tu correo y haz clic al botón para envíar un código</p>
          </header>

          <!-- Formulario principal: manejado por `js/forgot-password.js` -->
          <form id="forgotPasswordForm">
            <!-- Grupo de campo: etiqueta vinculada al input mediante for/id -->
            <div class="form-group">
              <label for="email">Correo Electrónico</label>
              <!-- Input de tipo email:
                   - `type="email"` activa validación básica del navegador.
                   - `required` evita envío vacío.
                   - `placeholder` ofrece un ejemplo visual. -->
              <input
                type="email"
                id="email"
                name="email"
                placeholder="admin@gmail.com"
                required
              />
            </div>

            <!-- Botón submit: dispara el evento submit del formulario -->
            <button type="submit" class="btn-primary">
              Envíar Código
            </button>

            <!-- Enlace de navegación: regresa a la página de login -->
            <p>
              <a href="login.html" class="back-to-login">Volver al Inicio de Sesión</a>
            </p>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
