<!--
  Archivo: change-password.html
  Propósito: Vista para que el usuario pueda cambiar su contraseña.
  Contenido: formulario con campos de nueva contraseña y confirmación,
    validación en el cliente mediante `js/change-password.js`, y protección
    de acceso mediante `js/auth-guard.js`.
  Dependencias:
    - CSS: css/main.css, css/components.css, css/auth.css
    - Iconos: Font Awesome (CDN)
    - Scripts: js/auth-guard.js, js/change-password.js (módulo)
  Notas de documentación:
    - Describir en README los endpoints backend que consumirá este formulario
      (ruta para actualizar la contraseña y requisitos de seguridad).
    - No incluir secretos ni credenciales en el front-end.
    - Añadir ejemplos de request (curl/Postman) en la documentación del proyecto.
-->

<!doctype html>
<html lang="es">
  <head>
    <!-- Configuración de caracteres especiales (tildes, ñ, etc.) -->
    <meta charset="UTF-8" />
    <!-- Hace que la página sea responsive (adaptable a móviles) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Título que aparece en la pestaña del navegador -->
    <title>Cambiar Contraseña - Divine Park</title>
    <!-- Archivos CSS para estilos generales, componentes y autenticación -->
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <!-- Librería externa de íconos (Font Awesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
     <!-- Script que valida si el usuario está autenticado -->
     <script src="js/auth-guard.js"></script>
    <script src="js/api.js"></script>
    <script src="js/change-password.js"></script>
  </head>
  

  <body>
    <!-- Contenedor principal de la vista de autenticación -->
    <main class="auth-container">
      <!-- Sección informativa (lado izquierdo) -->
      <section class="auth-info">
        <!-- Encabezado con logo y nombre del sistema -->
        <div class="auth-info__header">
          <img src="assets/logo.jpg" class="logo" alt="Logo" />
          <h1>Divine Park</h1>
        </div>
        <!-- Contenido descriptivo -->
        <div class="auth-info__content">
          <h2>Panel de Operador</h2>
          <p>
            Establece tu nueva contraseña de acceso. Asegúrate de crear una
            contraseña segura que contenga letras, números y caracteres especiales.
          </p>
        </div>
      </section>
      <!-- Sección del formulario -->
      <section class="auth-form-section">
        <div class="form-card">
          <!-- Encabezado del formulario -->
          <header class="form-card__header">
            <div class="lock-icon">
               <!-- Ícono de candado -->
              <i class="fas fa-lock"></i>
            </div>
            <h3>Cambiar Contraseña</h3>
            <p>Ingresa y confirma tu nueva contraseña</p>
          </header>
        
           <!-- Formulario para cambio de contraseña -->
          <form id="changePasswordForm">
            <!-- Campo: Nueva contraseña -->
            <div class="form-group">
              <label for="new_password">Nueva Contraseña</label>
              <div class="password-input-container">
                <input
                  type="password"
                  id="new_password"
                  name="new_password"
                  placeholder="Ingresa tu nueva contraseña"
                  required
                />
                <!-- Botón para mostrar/ocultar contraseña -->
                <button type="button" class="password-toggle" data-target="new_password">
                  <i class="fas fa-eye"></i>
                </button>
              </div>
            </div>
            <!-- Campo: Confirmar contraseña -->
            <div class="form-group">
              <label for="confirm_password">Confirmar Nueva Contraseña</label>
              <div class="password-input-container">
                <input
                  type="password"
                  id="confirm_password"
                  name="confirm_password"
                  placeholder="Confirma tu nueva contraseña"
                  required
                />
                <!-- Botón para mostrar/ocultar contraseña -->
                <button type="button" class="password-toggle" data-target="confirm_password">
                  <i class="fas fa-eye"></i>
                </button>
              </div>
            </div>
            <!-- Botón para enviar el formulario -->
            <button type="submit" class="btn-primary">
              Actualizar Contraseña
            </button>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
